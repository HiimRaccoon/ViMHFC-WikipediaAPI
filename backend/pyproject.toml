[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vimfc"
version = "0.1.0"
description = "Historical Vietnamese Wikipedia corpus builder"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "mwparserfromhell>=0.7,<1", "psutil>=7,<8", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vimfc = "vimfc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
